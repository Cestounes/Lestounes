spring.application.name=lestounes
spring.mongodb.host=${MONGO_DOMAIN:localhost}
spring.mongodb.username=${MONGO_USERNAME:mongo-user}
spring.mongodb.password=${MONGO_PASSWORD:mongo-password}
spring.mongodb.authentication-database=${MONGO_AUTHSOURCE:admin}
spring.mongodb.database=${MONGO_DB:lestounes}
spring.mongodb.port=${MONGO_PORT:27017}
logging.level.com.lefredy.lestounes.filters.GlobalRequestLoggingFilter=${DEBUG_LEVEL:INFO}
spring.data.mongodb.auto-index-creation=true
spring.mongodb.representation.uuid=standard
server.port=${PORT:9080}
