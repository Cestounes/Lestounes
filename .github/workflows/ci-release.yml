name: ci-release.yml
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'


jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '21', '25' ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: Build and run tests
        run: chmod +x ./mvnw && ./mvnw -B clean verify -Djava.version=${{ matrix.java }}
      - name: publish .jar as artifact
        if: matrix.java == '25'
        uses: actions/upload-artifact@v5
        with:
          name: application-jar
          path: target/*.jar
#      - name: publish jacoco tests
#        if: always() && matrix.java == '25'
#        uses: actions/upload-artifact@v5
#        with:
#          name: jacoco-reports
#          path: target/site/jacoco
  build-and-push-image:
    needs: build-and-test
    if: github.event_name == 'push' && needs.build-and-test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
      - name: Download .jar
        uses: actions/download-artifact@v5
        with:
          name: application-jar
          path: target/
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Convert to lowercase
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/lestounes:latest
            ghcr.io/${{ env.OWNER_LC }}/lestounes:${{ github.ref_name }}
  create-release:
    needs: build-and-test
    if: github.event_name == 'push' && needs.build-and-test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
      - name: Download .jar
        uses: actions/download-artifact@v5
        with:
          name: application-jar
          path: target/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: target/*.jar

