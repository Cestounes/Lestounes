name: pull-request-ci.yml
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - dev


jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '21', '25' ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build and run tests
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: chmod +x ./mvnw && ./mvnw -B clean verify -Djava.version=${{ matrix.java }} org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.organization=cestounes
      - name: publish .jar as artifact
        if: matrix.java == '25'
        uses: actions/upload-artifact@v5
        with:
          name: application-jar
          path: target/*.jar
      - name: publish jacoco tests
        if: always() && matrix.java == '25'
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-reports
          path: target/site/jacoco
      - name: publish surefire report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/*.txt

